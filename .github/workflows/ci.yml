name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: "off"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - name: Formatting
        run: make fmt-check
      - name: Module graph and exact pins
        run: make check-mod
      - name: Vet
        run: make vet
      - name: Tests
        run: make test
      - name: Race tests
        run: make test-race
      - name: Build
        run: make build
